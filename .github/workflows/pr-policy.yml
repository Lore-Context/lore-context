name: PR Policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body-policy:
    name: pr-body-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check required PR evidence
        shell: bash
        run: |
          set -euo pipefail

          body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          labels="$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | tr '\n' ' ')"

          missing=()
          required_patterns=(
            '^## Summary'
            '^## Linear'
            '^Linear:'
            '^## Scope'
            '^## Production Safety'
            '^Production touched:'
            '^Human gate needed:'
            '^## Verification'
            '^## Not Tested'
          )

          for pattern in "${required_patterns[@]}"; do
            if ! grep -Eiq "$pattern" <<<"$body"; then
              missing+=("$pattern")
            fi
          done

          if ((${#missing[@]} > 0)); then
            {
              echo "PR body is missing required evidence sections:"
              printf ' - %s\n' "${missing[@]}"
              echo
              echo "Use .github/pull_request_template.md and fill in real verification results."
            } >&2
            exit 1
          fi

          if grep -Eiq '^Production touched:[[:space:]]*yes' <<<"$body"; then
            if ! grep -Eq '(^| )(human-gated|production-blocked)( |$)' <<<"$labels"; then
              echo "Production-touched PRs must carry human-gated or production-blocked label." >&2
              exit 1
            fi
          fi

          if grep -Eiq '^Human gate needed:[[:space:]]*yes' <<<"$body"; then
            if ! grep -Eq '(^| )human-gated( |$)' <<<"$labels"; then
              echo "Human-gated PRs must carry the human-gated label." >&2
              exit 1
            fi
          fi

          echo "PR body policy passed."

  release-guardrail-review:
    name: release-guardrail-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Require release guardrail review evidence
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$base_ref" --depth=200 || git fetch origin "$base_ref"
          changed="$(git diff --name-only "origin/$base_ref"...HEAD)"
          release_touched="$(grep -E '^(\.github/workflows/|scripts/release/|ops/release-contract|docs/deployment/release-automation\.md|apps/website/(src/site\.mjs|scripts/verify\.mjs))' <<<"$changed" || true)"
          if [[ -z "$release_touched" ]]; then
            echo "No release guardrail paths changed."
            exit 0
          fi

          body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          missing=()
          required_patterns=(
            '^Release workflow review:'
            '^Production smoke review:'
            '^Version consistency review:'
          )
          for pattern in "${required_patterns[@]}"; do
            if ! grep -Eiq "$pattern" <<<"$body"; then
              missing+=("$pattern")
            fi
          done

          if ((${#missing[@]} > 0)); then
            {
              echo "Release workflow paths changed, but PR body is missing required guardrail review evidence:"
              printf ' - %s\n' "${missing[@]}"
              echo
              echo "Touched release paths:"
              printf '%s\n' "$release_touched"
            } >&2
            exit 1
          fi

          echo "Release guardrail review evidence present."
