name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  dco-check:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout PR head with base ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify every non-merge commit has Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=()
          # Walk non-merge commits between PR base and head.
          # `git log --no-merges` skips merge commits (DCO convention does not
          # require sign-off on merges).
          while IFS= read -r sha; do
            if [ -z "$sha" ]; then continue; fi
            body=$(git log -1 --format=%B "$sha")
            if ! echo "$body" | grep -qE '^[Ss]igned-off-by: .+ <.+@.+>'; then
              missing+=("$sha")
            fi
          done < <(git log --no-merges --pretty=%H "$BASE_SHA..$HEAD_SHA")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "DCO check failed: the following non-merge commits are missing Signed-off-by:" >&2
            for sha in "${missing[@]}"; do
              subject=$(git log -1 --format='%s' "$sha")
              echo "  - $sha  $subject" >&2
            done
            echo "" >&2
            echo "To fix:" >&2
            echo "  git rebase --signoff $BASE_SHA" >&2
            echo "  git push --force-with-lease" >&2
            exit 1
          fi
          echo "[ok] all non-merge commits in PR have Signed-off-by"

      - name: Comment on missing DCO
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                'One or more commits on this PR are missing a `Signed-off-by` line.',
                '',
                'Lore Context contributions require **DCO sign-off**. To fix:',
                '',
                '```bash',
                'git config --global user.name "Your Name"',
                'git config --global user.email "your-email@example.com"',
                'git rebase --signoff main',
                'git push --force-with-lease',
                '```',
                '',
                'See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#dco-developer-certificate-of-origin) for details.'
              ].join('\n')
            })
