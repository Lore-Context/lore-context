[project]
name = "lore-context"
version = "0.1.0"
description = "Generated Python SDK for Lore Context."
readme = "README.md"
requires-python = ">=3.8,<4.0"
dependencies = [
  "httpx>=0.21.2",
  "pydantic>=1.9.2",
  "typing_extensions>=4.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
