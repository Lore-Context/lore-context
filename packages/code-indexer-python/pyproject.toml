[project]
name = "lore-context-code-indexer"
version = "0.1.0"
description = "Lore Context code knowledge graph indexer — privacy-strict Tree-sitter client."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "tree-sitter>=0.21",
  "tree-sitter-typescript",
  "tree-sitter-python",
  "tree-sitter-go",
  "watchdog>=3",
  "httpx>=0.27",
  "xxhash",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "build",
]

[project.scripts]
lore-index = "lore_code_indexer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
