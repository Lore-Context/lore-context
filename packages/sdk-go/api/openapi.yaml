openapi: 3.1.0
info:
  description: "Local-first AI agent context control plane for memory, traces, eval,\
    \ governance, and Evidence Ledger inspection."
  title: Lore Context API
  version: 1.9.0
servers:
- description: Local development API
  url: http://127.0.0.1:3000
security:
- bearerAuth: []
- loreApiKey: []
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: API health
      security: []
      summary: Read service health
  /openapi.json:
    get:
      operationId: getOpenApiDocument
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
          description: OpenAPI document
      security: []
      summary: Read the machine-readable OpenAPI contract
  /.well-known/oauth-protected-resource:
    get:
      operationId: getHostedMcpProtectedResourceMetadata
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
          description: Hosted MCP protected-resource metadata
      security: []
      summary: Read hosted MCP OAuth protected-resource metadata
  /.well-known/oauth-authorization-server:
    get:
      operationId: getHostedMcpAuthorizationServerMetadata
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
          description: Hosted MCP authorization-server metadata
      security: []
      summary: Read hosted MCP authorization-server metadata
  /mcp:
    post:
      operationId: hostedMcpJsonRpc
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: {}
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
          description: MCP JSON-RPC response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid hosted MCP bearer token; WWW-Authenticate
            points to OAuth metadata
          headers:
            WWW-Authenticate:
              explode: false
              schema:
                type: string
              style: simple
      security:
      - bearerAuth: []
      summary: Run hosted MCP JSON-RPC over HTTP
  /v1/context/query:
    post:
      operationId: contextQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextQueryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextQueryResponse"
          description: Composed context
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Compose agent context and write a trace
  /v1/memory/write:
    post:
      operationId: memoryWrite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryWriteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryWriteResponse"
          description: Written memory
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Write governed memory
  /v1/memory/{id}:
    get:
      operationId: memoryGet
      parameters:
      - description: Memory id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/memoryGet_200_response"
          description: Memory detail
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Read memory by id
    patch:
      operationId: memoryUpdate
      parameters:
      - description: Memory id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryWriteResponse"
          description: Updated memory
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Patch a memory in place
  /v1/memory/{id}/supersede:
    post:
      operationId: memorySupersede
      parameters:
      - description: Memory id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/memorySupersede_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/memorySupersede_200_response"
          description: Supersede result
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Create a successor memory and archive the old one
  /v1/memory/search:
    post:
      operationId: memorySearch
      parameters:
      - description: Set to 1/true/yes to include per-stream diagnostics in the response
          (opt-in; also accepts X-Lore-Diagnostics request header)
        explode: true
        in: query
        name: diagnostics
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/memorySearch_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/memorySearch_200_response"
          description: Memory hits
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/memorySearch_400_response"
          description: Invalid bi-temporal parameter
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Search memory without composing context
  /v1/memory/list:
    get:
      operationId: memoryList
      parameters:
      - description: Filter by project id
        explode: true
        in: query
        name: project_id
        required: false
        schema:
          type: string
        style: form
      - description: Filter by memory scope
        explode: true
        in: query
        name: scope
        required: false
        schema:
          type: string
        style: form
      - description: Filter by memory lifecycle status
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: Filter by memory type
        explode: true
        in: query
        name: memory_type
        required: false
        schema:
          type: string
        style: form
      - description: Filter by memory content substring
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: Maximum rows
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/memoryList_200_response"
          description: Memory list
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: List memories visible to the caller
  /v1/memory/export:
    get:
      operationId: memoryExport
      parameters:
      - description: Project id
        explode: true
        in: query
        name: project_id
        required: false
        schema:
          type: string
        style: form
      - description: json or markdown
        explode: true
        in: query
        name: format
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
            text/markdown:
              schema:
                type: string
          description: MIF export
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Export memory as MIF JSON or Markdown
  /v1/memory/import:
    post:
      operationId: memoryImport
      parameters:
      - description: Project id
        explode: true
        in: query
        name: project_id
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/memoryImport_200_response"
          description: Import result
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Import MIF memory
  /v1/memory/forget:
    post:
      operationId: memoryForget
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/memoryForget_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/memoryForget_200_response"
          description: Forget result
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Soft or hard delete memories
  /v1/governance/review-queue:
    get:
      operationId: governanceReviewQueue
      parameters:
      - description: Project id
        explode: true
        in: query
        name: project_id
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/memoryList_200_response"
          description: Review queue
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: List candidate or flagged memory requiring review
  /v1/governance/memory/{id}/approve:
    post:
      operationId: governanceMemoryApprove
      parameters:
      - description: Memory id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/governanceMemoryApprove_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/memoryGet_200_response"
          description: Approved memory
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Approve a candidate or flagged memory
  /v1/governance/memory/{id}/reject:
    post:
      operationId: governanceMemoryReject
      parameters:
      - description: Memory id
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/governanceMemoryReject_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/memoryGet_200_response"
          description: Rejected memory
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Reject a candidate or flagged memory
  /v1/audit-logs:
    get:
      operationId: auditLogList
      parameters:
      - description: Maximum rows
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auditLogList_200_response"
          description: Audit logs
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: List audit log entries
  /v1/events/ingest:
    post:
      operationId: eventsIngest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/eventsIngest_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/eventsIngest_200_response"
          description: Event result
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Ingest agent telemetry event
  /v1/integrations/agentmemory/health:
    get:
      operationId: agentmemoryHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
          description: agentmemory health
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Read agentmemory adapter health
  /v1/integrations/agentmemory/sync:
    post:
      operationId: agentmemorySync
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agentmemorySync_200_response"
          description: Sync result
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Sync memory from agentmemory
  /v1/traces:
    get:
      operationId: traceList
      parameters:
      - description: Filter by project id
        explode: true
        in: query
        name: project_id
        required: false
        schema:
          type: string
        style: form
      - description: Maximum rows
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/traceList_200_response"
          description: Trace list
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: List context traces
  /v1/traces/{trace_id}/feedback:
    post:
      operationId: traceFeedback
      parameters:
      - description: Trace id
        explode: false
        in: path
        name: trace_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/traceFeedback_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/traceFeedback_200_response"
          description: Updated trace
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Record feedback on a trace
  /v1/traces/{trace_id}:
    get:
      operationId: traceGet
      parameters:
      - description: Trace id
        explode: false
        in: path
        name: trace_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/traceFeedback_200_response"
          description: Trace detail
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Read one context trace
  /v1/evidence/ledger/{trace_id}:
    get:
      operationId: evidenceLedgerGet
      parameters:
      - description: Trace id
        explode: false
        in: path
        name: trace_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/evidenceLedgerGet_200_response"
          description: Evidence Ledger
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Read Evidence Ledger for one trace
  /v1/evidence/ledgers:
    get:
      operationId: evidenceLedgerList
      parameters:
      - description: Filter by project id
        explode: true
        in: query
        name: project_id
        required: false
        schema:
          type: string
        style: form
      - description: Maximum rows
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/evidenceLedgerList_200_response"
          description: Evidence Ledger list
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: List recent Evidence Ledgers
  /v1/eval/providers:
    get:
      operationId: evalProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/evalProviders_200_response"
          description: Eval providers
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: List eval providers
  /v1/eval/run:
    post:
      operationId: evalRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/evalRun_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/evalRun_200_response"
          description: Eval result
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Run retrieval evaluation
  /v1/eval/runs:
    get:
      operationId: evalRunList
      parameters:
      - description: Project id
        explode: true
        in: query
        name: project_id
        required: false
        schema:
          type: string
        style: form
      - description: Maximum rows
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/evalRunList_200_response"
          description: Eval runs
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: List eval runs
  /v1/eval/runs/{run_id}:
    get:
      operationId: evalRunGet
      parameters:
      - description: Eval run id
        explode: false
        in: path
        name: run_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/evalRunGet_200_response"
          description: Eval run
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Read one eval run
  /v1/eval/report:
    get:
      operationId: evalReport
      parameters:
      - description: Project id
        explode: true
        in: query
        name: project_id
        required: false
        schema:
          type: string
        style: form
      - description: md or json
        explode: true
        in: query
        name: format
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            text/markdown:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/evalReport_200_response"
          description: Eval report
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Render latest eval report
  /v1/cloud/install-token:
    post:
      operationId: cloudIssueInstallToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudIssueInstallToken_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudInstallTokenResponse"
          description: Install token
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: No valid web session
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Admin permission or CSRF required
      security:
      - bearerAuth: []
      - loreApiKey: []
      - loreSession: []
        loreCsrf: []
      summary: "Issue a single-use install token for local bridge pairing. Admin keys,\
        \ loopback calls, and signed-in web sessions with CSRF may issue tokens."
  /v1/cloud/devices/pair:
    post:
      operationId: cloudPairDevice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudPairDevice_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudPairResponse"
          description: Device paired
        "401":
          $ref: "#/components/responses/Unauthorized"
      security: []
      summary: Redeem an install token for device and service tokens
  /v1/cloud/tokens/revoke:
    post:
      operationId: cloudRevokeToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudRevokeToken_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cloudRevokeToken_200_response"
          description: Revoke result
      security:
      - bearerAuth: []
      - loreApiKey: []
      summary: Revoke a cloud token
  /v1/cloud/tokens/rotate:
    post:
      operationId: cloudRotateToken
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudRotatedToken"
          description: Rotated token
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      summary: Rotate the presented device or service token
  /v1/cloud/whoami:
    get:
      operationId: cloudWhoAmI
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudWhoAmIResponse"
          description: Cloud identity
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      summary: Identify the cloud caller
  /v1/cloud/vaults:
    get:
      operationId: cloudListVaults
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cloudListVaults_200_response"
          description: Vault list
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      summary: List vaults visible to the caller
  /v1/connectors:
    get:
      operationId: connectorList
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/connectorList_200_response"
          description: Connector list
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      summary: List connector providers and vault-scoped connections
  /v1/connectors/{provider}/authorize:
    post:
      description: v1.0 Google Drive connector OAuth is separate from Google sign-in.
        When live credentials are absent the route returns private-beta credential
        status instead of pretending Drive is live.
      operationId: connectorAuthorize
      parameters:
      - description: Connector provider id
        explode: false
        in: path
        name: provider
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/connectorAuthorize_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorAuthorizationUrl"
          description: Authorization URL
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      summary: Create a connector OAuth authorization URL
  /v1/connectors/{provider}/callback:
    post:
      description: Fixture-backed private-beta callback. Non-fixture live callbacks
        fail closed until Google Drive OAuth credentials and token encryption are
        configured.
      operationId: connectorCallback
      parameters:
      - description: Connector provider id
        explode: false
        in: path
        name: provider
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/connectorCallback_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/connectorCallback_201_response"
          description: Connector connection
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      summary: Complete a connector OAuth callback
  /v1/connectors/{provider}/webhook:
    post:
      operationId: connectorWebhook
      parameters:
      - description: Connector provider id
        explode: false
        in: path
        name: provider
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/connectorWebhook_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorWebhookResult"
          description: Webhook accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorWebhookResult"
          description: Webhook rejected
      security: []
