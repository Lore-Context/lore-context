            \ queries (\"what would Lore have answered at this moment?\"). Mutually\
            \ exclusive with asOfSystemTime and asOfValidTime."
          format: date-time
          type: string
        asOfSystemTime:
          description: "v1.4 bi-temporal: ISO 8601 datetime for the system-knowledge\
            \ axis. Filters to facts that Lore had recorded by this timestamp (t_created\
            \ <= asOfSystemTime) and had not yet expired (t_expired IS NULL OR t_expired\
            \ > asOfSystemTime). Must not be in the future beyond 5 minutes. Mutually\
            \ exclusive with asOf."
          format: date-time
          type: string
        asOfValidTime:
          description: "v1.4 bi-temporal: ISO 8601 datetime for the business-validity\
            \ axis. Filters to facts whose validity window covers this timestamp (valid_from\
            \ <= asOfValidTime AND (valid_until IS NULL OR valid_until > asOfValidTime)).\
            \ Future values are allowed for forward-looking domain queries. Mutually\
            \ exclusive with asOf."
          format: date-time
          type: string
      required:
      - query
